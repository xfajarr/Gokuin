# CRE secret-NAME mapping. No values live here, ever, only the NAME the
# workflow asks for (`SCORE_WEIGHTS`, see workflow/workflow.ts configSchema
# `weightsSecretId`) and which env var / Vault entry that name resolves to per
# target. Real values are created out-of-band with:
#
#   cre secrets create --target=staging-settings
#
# and are only ever read back inside the confidential workflow's enclave via
# `runtime.getSecrets`. For local `cre workflow simulate` runs, the CLI
# resolves each name below from the process environment (or an `--env` file) :
# see cre/README.md "how secrets are supplied" for exactly how to run this
# safely (never commit a populated `.env`; `cre/.gitignore` also excludes it).
secretsNames:
  SCORE_WEIGHTS:
    - SCORE_WEIGHTS_STAGING
